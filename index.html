<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/cokite/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cokite Forecast — Marine & Wind</title>
    <script></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div id="splash" style="
        position:fixed;inset:0;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:20px;
        background:#f1f5f9;z-index:9999;
        animation:splash-fade 0.4s ease 1.8s forwards;
      ">
        <img src="/cokite/logo.png" alt="" width="72" height="72" style="border-radius:16px;opacity:0.95">
        <div style="display:flex;gap:8px;align-items:center;">
          <span style="width:10px;height:10px;border-radius:50%;background:#38bdf8;
            animation:dot-bounce 1.2s ease-in-out infinite;animation-delay:0s"></span>
          <span style="width:10px;height:10px;border-radius:50%;background:#38bdf8;
            animation:dot-bounce 1.2s ease-in-out infinite;animation-delay:0.2s"></span>
          <span style="width:10px;height:10px;border-radius:50%;background:#38bdf8;
            animation:dot-bounce 1.2s ease-in-out infinite;animation-delay:0.4s"></span>
        </div>
        <span style="color:#64748b;font-family:Inter,sans-serif;font-size:13px;letter-spacing:0.05em;">
          Cokite Forecast
        </span>
      </div>
    </div>
    <style>
      @keyframes dot-bounce {
        0%,80%,100% { transform:translateY(0);opacity:0.4 }
        40%          { transform:translateY(-8px);opacity:1 }
      }
      @keyframes splash-fade {
        to { opacity:0;pointer-events:none }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
