<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Ice/frost crystals matching image -->
  <g fill="#5B9BD5">
    <!-- Crystal 1 (left) -->
    <polygon points="20,55 26,65 20,75 14,65" fill="none" stroke="#5B9BD5" stroke-width="2.5"/>
    <line x1="20" y1="52" x2="20" y2="78" stroke="#5B9BD5" stroke-width="2.5"/>
    <line x1="12" y1="60" x2="28" y2="70" stroke="#5B9BD5" stroke-width="2.5"/>
    <line x1="28" y1="60" x2="12" y2="70" stroke="#5B9BD5" stroke-width="2.5"/>
    <!-- Crystal 2 (center) -->
    <polygon points="50,48 58,62 50,76 42,62" fill="none" stroke="#5B9BD5" stroke-width="2.5"/>
    <line x1="50" y1="44" x2="50" y2="80" stroke="#5B9BD5" stroke-width="2.5"/>
    <line x1="40" y1="55" x2="60" y2="69" stroke="#5B9BD5" stroke-width="2.5"/>
    <line x1="60" y1="55" x2="40" y2="69" stroke="#5B9BD5" stroke-width="2.5"/>
    <!-- Crystal 3 (right) -->
    <polygon points="80,55 86,65 80,75 74,65" fill="none" stroke="#5B9BD5" stroke-width="2.5"/>
    <line x1="80" y1="52" x2="80" y2="78" stroke="#5B9BD5" stroke-width="2.5"/>
    <line x1="72" y1="60" x2="88" y2="70" stroke="#5B9BD5" stroke-width="2.5"/>
    <line x1="88" y1="60" x2="72" y2="70" stroke="#5B9BD5" stroke-width="2.5"/>
    <!-- Icicles hanging -->
    <polygon points="20,78 23,88 17,88" fill="#5B9BD5"/>
    <polygon points="50,80 53,92 47,92" fill="#5B9BD5"/>
    <polygon points="80,78 83,88 77,88" fill="#5B9BD5"/>
  </g>
</svg>
