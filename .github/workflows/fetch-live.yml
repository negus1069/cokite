name: Fetch live wind data

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch weameter (Rivedoux)
        run: |
          curl -sf "https://weameter.com/stations/ilederekitesurf/windrt.json" \
            -o public/live/weameter-rivedoux.json || echo '{"error":"fetch failed"}' > public/live/weameter-rivedoux.json

      - name: Fetch clientraw (Chatelaillon)
        run: |
          curl -sf "https://www.meteolarochelle.fr/wdlchatel/clientraw.txt" \
            -o public/live/clientraw-chatelaillon.txt || echo 'error' > public/live/clientraw-chatelaillon.txt

      - name: Commit updated live data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/live/
          git diff --staged --quiet || git commit -m "chore: update live wind data [skip ci]"
          git push
